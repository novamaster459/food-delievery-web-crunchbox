<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrunchBox — Our Locations</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/storefront-customization.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════
       TOP HEADER BAR
  ═══════════════════════════════════════════════════ -->
  <header class="app-header">
    <div class="header-left">
      <a href="/" class="location-btn" id="back-home-btn">
        <span class="loc-icon">←</span>
        <div class="loc-text-wrap">
          <span class="loc-value">Back to Home</span>
        </div>
      </a>
    </div>
    <div class="shop-logo-area">
      <span id="shop-name" class="shop-name-text">CrunchBox</span>
    </div>
    <div class="header-right"></div>
  </header>

  <!-- ═══════════════════════════════════════════════════
       BRANCH LOCATIONS
  ═══════════════════════════════════════════════════ -->
  <main class="locations-page">
    <div class="section-header locations-page-header">
      <h2 class="section-title">📍 Our Locations</h2>
      <span class="section-subtitle" id="locations-count-label">Loading…</span>
    </div>

    <div class="store-locations-grid" id="store-locations-grid">
      <!-- JS-rendered branch cards -->
    </div>

    <p class="store-locations-empty hidden" id="store-locations-empty">No branch locations have been added yet.</p>
  </main>

<script>
(async function () {
  const grid = document.getElementById('store-locations-grid');
  const empty = document.getElementById('store-locations-empty');
  const count = document.getElementById('locations-count-label');

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    })[char]);
  }

  let locations = [];
  try {
    const res = await fetch('/api/locations', { credentials: 'include' });
    locations = await res.json();
  } catch (error) {
    count.textContent = 'Could not load locations.';
    return;
  }

  const openCount = locations.filter((loc) => loc.is_open).length;
  count.textContent = locations.length
    ? `${locations.length} branch${locations.length > 1 ? 'es' : ''} · ${openCount} open now`
    : '';
  empty.classList.toggle('hidden', locations.length > 0);

  locations.forEach((location) => {
    const card = document.createElement('article');
    card.className = 'branch-card branch-card--detailed';
    const imageMarkup = location.image_url
      ? `<img class="branch-card-img" src="${escapeHTML(location.image_url)}" alt="${escapeHTML(location.name)}" loading="lazy">`
      : '<div class="branch-card-img branch-card-img--placeholder" aria-hidden="true">📍</div>';
    const status = location.is_open
      ? '<span class="branch-status branch-status--open">Open now</span>'
      : '<span class="branch-status branch-status--closed">Closed</span>';
    card.innerHTML = `
      ${imageMarkup}
      <div class="branch-card-body">
        <div class="branch-card-head">
          <h3 class="branch-card-name">${escapeHTML(location.name)}</h3>
          ${status}
        </div>
        <p class="branch-card-meta">Branch No. ${escapeHTML(location.branch_no)}</p>
        ${location.address ? `<p class="branch-card-address">${escapeHTML(location.address)}</p>` : ''}
        <div class="branch-card-hours-row">
          <div class="branch-hours-block">
            <span class="branch-hours-label">Opening Hour</span>
            <span class="branch-hours-value">${escapeHTML(location.open_label || location.open_time)}</span>
          </div>
          <div class="branch-hours-block">
            <span class="branch-hours-label">Closing Hour</span>
            <span class="branch-hours-value">${escapeHTML(location.close_label || location.close_time)}</span>
          </div>
        </div>
      </div>`;
    grid.appendChild(card);
  });
})();
</script>
</body>
</html>
